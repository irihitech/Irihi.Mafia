name: Release Tag

on:
  workflow_dispatch:
    inputs:
      Upload_to_NuGet:
        description: 'Upload to NuGet'
        default: false
        type: boolean
      Irihi_Mafia:
        description: 'Pack Irihi.Mafia'
        default: true
        type: boolean
      Irihi_Mafia_Themes_TDesign:
        description: 'Pack Irihi.Mafia.Themes.TDesign'
        default: true
        type: boolean

jobs:
  nuget:
    uses: ./.github/workflows/pack.yml
    with:
      Upload_to_NuGet: ${{ inputs.Upload_to_NuGet }}
      Irihi_Mafia: ${{ inputs.Irihi_Mafia }}
      Irihi_Mafia_Themes_TDesign: ${{ inputs.Irihi_Mafia_Themes_TDesign }}
    secrets: inherit

  publish:
    uses: ./.github/workflows/publish.yml

  draft-release:
    needs: [ nuget, publish ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8

      - name: Display structure of downloaded files
        run: ls -R

      - name: Zip artifacts
        run: |
          zip -rj Irihi.Mafia.Demo.Desktop.win-x64.zip Irihi.Mafia.Demo.Desktop.win-x64
          zip -rj Irihi.Mafia.Demo.Desktop.linux-x64.zip Irihi.Mafia.Demo.Desktop.linux-x64
          zip -rj Irihi.Mafia.Demo.Desktop.osx-arm64.zip Irihi.Mafia.Demo.Desktop.osx-arm64
          zip -rj Irihi.Mafia.Demo.Desktop.osx-x64.zip Irihi.Mafia.Demo.Desktop.osx-x64

      - name: Display structure of zipped files
        run: ls -R

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          generate_release_notes: true
          draft: true
          files: |
            nugets/*.nupkg
            android-arm64/*.apk
            *.zip
